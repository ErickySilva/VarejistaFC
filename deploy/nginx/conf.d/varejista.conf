# Proxy reverso do Varejista FC (HTTP).
#
# Este arquivo atende em HTTP puro e serve para a primeira subida e para os
# testes. Antes de receber contas reais, o site precisa de HTTPS: o modelo
# está em deploy/nginx/https.conf.example.

# Limite de requisições por IP nas rotas HTTP de autenticação. A aplicação
# entra por Server Actions (com limite próprio de tentativas); estas rotas
# quase não são usadas, então o limite pode ser apertado.
#   - login: 8 de uma vez e depois 1 por minuto;
#   - demais rotas de autenticação: 30 por minuto.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=auth_general:10m rate=30r/m;
limit_req_status 429;

upstream varejista_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;

  server_tokens off;
  client_max_body_size 1m;

  # Saúde do próprio Nginx (usada pelo healthcheck do contêiner).
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/auth/sign-in/ {
    limit_req zone=auth_login burst=7 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://varejista_app;
  }

  location /api/auth/ {
    limit_req zone=auth_general burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://varejista_app;
  }

  location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://varejista_app;
  }
}
