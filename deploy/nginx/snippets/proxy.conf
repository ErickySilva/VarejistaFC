# Cabeçalhos enviados à aplicação. Incluído em cada `location` que faz proxy.

proxy_http_version 1.1;
proxy_set_header Connection "";

# Endereço pelo qual o visitante chegou, com a porta. A aplicação compara
# com a origem das requisições (Server Actions e autenticação).
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;

# IP real do visitante. É SOBRESCRITO, não acrescentado: o que o cliente
# mandar em X-Forwarded-For é descartado. O limite de tentativas de login da
# aplicação confia neste cabeçalho, então ele só pode vir daqui.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
